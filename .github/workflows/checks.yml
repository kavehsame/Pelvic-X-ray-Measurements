name: Software checks
'on':
  pull_request: {}
  workflow_dispatch: {}
  workflow_call: {}
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PIP_CACHE_DIR: ${{ github.workspace }}/.cache/pip
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.13'
    - name: Install development dependencies
      run: python -m pip install -r requirements-dev.txt
    - name: Restore pinned assets
      run: python scripts/fetch_assets.py
    - name: Install Linux rendering prerequisites
      run: 'sudo apt-get update

        sudo apt-get install -y xvfb libxcb-xinerama0 libxkbcommon-x11-0 libxcb-cursor0 libglu1-mesa libopengl0
        libpulse0 libpulse-mainloop-glib0 libnss3 libasound2t64 qt5dxcb-plugin'
    - name: Restore the pinned Slicer runtime
      run: python scripts/install_slicer_ci.py
    - name: Verify both editions
      run: xvfb-run -a python scripts/ci.py
      env:
        LIBGL_ALWAYS_SOFTWARE: '1'
    - name: Audit publication source
      run: python scripts/audit_release.py --source-only
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      name: Software-check evidence
      if: always()
      with:
        name: software-check-evidence
        path: 'build/ci-verification/**/*.json

          build/ci-verification/**/*.xml

          build/ci-verification/**/*.csv

          build/ci-verification/**/*.html

          build/ci-verification/**/*.log'
        retention-days: 14
