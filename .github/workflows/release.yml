name: Prepare release draft
'on':
  workflow_dispatch: {}
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PIP_CACHE_DIR: ${{ github.workspace }}/.cache/pip
jobs:
  verify:
    uses: ./.github/workflows/checks.yml
  package:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.13'
    - name: Install development dependencies
      run: python -m pip install -r requirements-dev.txt
    - name: Restore pinned assets
      run: python scripts/fetch_assets.py
    - name: Build website
      run: python scripts/build.py
    - name: Check published-path and offline behaviour
      run: python scripts/check_site.py
    - name: Package product downloads
      run: python scripts/package_release.py
    - name: Audit release
      run: python scripts/audit_release.py
    - name: Create a reviewable draft
      run: python scripts/create_draft_release.py
      env:
        GH_TOKEN: ${{ github.token }}
