name: Publish website
'on':
  push:
    branches:
    - main
  workflow_dispatch: {}
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PIP_CACHE_DIR: ${{ github.workspace }}/.cache/pip
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  verify:
    uses: ./.github/workflows/checks.yml
  build:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.13'
    - name: Install development dependencies
      run: python -m pip install -r requirements-dev.txt
    - name: Restore pinned assets
      run: python scripts/fetch_assets.py
    - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
    - name: Build website
      run: python scripts/build.py
    - name: Check published-path and offline behaviour
      run: python scripts/check_site.py
    - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
      with:
        path: build/site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
      id: deployment
